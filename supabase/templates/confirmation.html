<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f4f2;color:#161616;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:48px 24px">
      <p style="margin:0 0 28px;font-size:15px;font-weight:700">CHICKGRAPH</p>
      <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2">Verify your email</h1>
      <p style="margin:0 0 28px;color:#5f5f5b;font-size:15px;line-height:1.6">
        Enter this six-digit code to finish creating your account.
      </p>
      <div style="display:inline-block;padding:16px 22px;border:1px solid #d4d4cf;background:#fff;font-family:monospace;font-size:30px;font-weight:700;letter-spacing:0">
        {{ .Token }}
      </div>
      <p style="margin:28px 0 0;color:#777772;font-size:13px">This code expires in 15 minutes.</p>
    </div>
  </body>
</html>
